{% extends "base.html" %}{% block content %}<h1>سجل العمليات (آخر 300)</h1><div class="tablewrap"><table><tr><th>الوقت (UTC)</th><th>المستخدم</th><th>العملية</th><th>الكيان</th><th>المعرف</th><th>تفاصيل</th></tr>
{% for l in logs %}<tr><td>{{ l.ts.strftime('%Y-%m-%d %H:%M') }}</td><td>{{ l.username }}</td><td>{{ l.action }}</td><td>{{ l.entity }}</td><td>{{ l.entity_id }}</td><td>{{ l.detail }}</td></tr>{% endfor %}</table></div>{% endblock %}
